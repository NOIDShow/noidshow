<!--page title="Listen Live | NO ID" path="/live/" nav="live" description="Listen to NO ID live from North Idaho as Paul Banducci and Scott Moskowitz record the show."-->
{{HEAD}}
<body>
{{HEADER}}
<main id="main" class="section">
  <div class="wrap">
    <div class="live-studio">
      <img class="live-studio__mark" src="/assets/img/no-id-circle-final.webp" width="768" height="768" alt="">
      <div>
        <p class="eyebrow">The NO ID Show</p>
        <h1 class="h-display h-section">Live from <em>North Idaho.</em></h1>
        <p class="lede">Listen in as Paul Banducci and Scott Moskowitz record NO ID.</p>
        <p class="live-status" data-live-status role="status">Checking broadcast status…</p>
        <audio data-live-audio controls preload="none" aria-label="NO ID live audio" hidden></audio>
        <p data-live-help hidden></p>
        <p><a class="btn btn--red" href="/#latest">Listen to the latest episode</a></p>
        <noscript><p>Enable JavaScript to check the broadcast and load the live player.</p></noscript>
      </div>
    </div>
  </div>
</main>
{{FOOTER}}
{{LIVE_SCRIPT}}
</body>
</html>
